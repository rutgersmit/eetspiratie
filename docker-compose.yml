services:
  eetspiratie:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Set these in a .env file next to this file (never commit it), see .env.example
      - AUTH_USERNAME=${AUTH_USERNAME:?AUTH_USERNAME is not set}
      - AUTH_PASSWORD=${AUTH_PASSWORD:?AUTH_PASSWORD is not set}
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET is not set}
      - COOKIE_SECURE=${COOKIE_SECURE:-}
    volumes:
      # SQLite database + uploaded images (back this folder up)
      - ./data:/app/data
    restart: unless-stopped
